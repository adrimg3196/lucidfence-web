name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Prepare static site
        run: |
          rm -rf _site && mkdir _site
          cp index.html web.html web-core.js web-store.js web-cloud.js web-app.js \
            web-worker.js sw.js runtime.json manifest.webmanifest lucidfence-icon.svg \
            .nojekyll _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
          retention-days: 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
